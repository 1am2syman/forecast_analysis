<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Static dashboard validation gallery</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #edf3f1;
        --panel: #ffffff;
        --line: #c8d5d1;
        --text: #172421;
        --muted: #536762;
        --accent: #087f75;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px;
        font:
          14px/1.5 system-ui,
          sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      header {
        max-width: 1500px;
        margin: 0 auto 32px;
      }
      h1,
      h2 {
        margin: 0;
      }
      h1 {
        font-size: 28px;
      }
      h2 {
        margin: 30px 0 12px;
        font-size: 17px;
        color: var(--accent);
      }
      p {
        color: var(--muted);
      }
      a {
        color: var(--accent);
      }
      main {
        max-width: 1500px;
        margin: auto;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 16px;
      }
      figure {
        margin: 0;
        padding: 10px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }
      img {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid var(--line);
      }
      figcaption {
        padding: 8px 2px 0;
        color: var(--muted);
        font-family: ui-monospace, monospace;
        font-size: 12px;
      }
    </style>
  </head>
