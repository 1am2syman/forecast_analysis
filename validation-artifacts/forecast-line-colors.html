<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forecast chart line colors</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f7f7;
        color: #263238;
        font-family: system-ui, sans-serif;
      }
      main {
        width: min(680px, calc(100% - 32px));
        padding: 32px;
        background: white;
        border: 1px solid #d7e0e0;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgb(30 50 50 / 8%);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      p {
        margin: 0 0 28px;
        color: #607278;
      }
      .series {
        display: grid;
        grid-template-columns: minmax(150px, 1fr) 130px 90px;
        align-items: center;
        gap: 20px;
        margin: 22px 0;
      }
      svg {
        width: 100%;
        height: 18px;
        overflow: visible;
      }
      strong {
        font-size: 17px;
      }
      code {
        color: #64748b;
      }
      @media (max-width: 520px) {
        main {
          padding: 24px 18px;
        }
        .series {
          grid-template-columns: 1fr;
          gap: 6px;
        }
        code {
          margin-top: -4px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Forecast vs actual — proposed palette</h1>
      <p>Color and stroke style both distinguish each series.</p>

      <div class="series">
        <svg aria-hidden="true" viewBox="0 0 300 18" preserveAspectRatio="none">
          <line
            x1="3"
            y1="9"
            x2="297"
            y2="9"
            stroke="#1D4ED8"
            stroke-width="5"
            stroke-linecap="round"
          />
        </svg>
        <strong>Actual</strong><code>#1D4ED8</code>
      </div>

      <div class="series">
        <svg aria-hidden="true" viewBox="0 0 300 18" preserveAspectRatio="none">
          <line
            x1="3"
            y1="9"
            x2="297"
            y2="9"
            stroke="#B45309"
            stroke-width="4"
            stroke-linecap="round"
            stroke-dasharray="14 9"
          />
        </svg>
        <strong>Vintage A</strong><code>#B45309</code>
      </div>

      <div class="series">
        <svg aria-hidden="true" viewBox="0 0 300 18" preserveAspectRatio="none">
          <line
            x1="3"
            y1="9"
            x2="297"
            y2="9"
            stroke="#047857"
            stroke-width="4"
            stroke-linecap="round"
            stroke-dasharray="2 7 14 7"
          />
        </svg>
        <strong>Vintage B</strong><code>#047857</code>
      </div>
    </main>
  </body>
</html>
